<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Patient</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:      #030d1a;
  --surface: #0a1a2e;
  --border:  #0d3050;
  --cyan:    #00e5ff;
  --cyan2:   #00b4d8;
  --green:   #00e676;
  --amber:   #ffd600;
  --text:    #e0f4ff;
  --muted:   #4a7a9b;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background-image:
    radial-gradient(ellipse 600px 400px at 20% 50%, #001a3320, transparent),
    radial-gradient(ellipse 400px 600px at 80% 30%, #003a5510, transparent);
}

.card{
  width:100%;
  max-width:440px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:40px 36px;
  box-shadow:0 0 60px #00e5ff0a, 0 0 0 1px #00e5ff08;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
}

.logo{
  display:flex;align-items:center;gap:10px;
  margin-bottom:28px;
}
.logo-icon{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.logo-text{
  font-family:'Space Mono',monospace;
  font-size:13px;color:var(--cyan);letter-spacing:2px;
}

h2{
  font-size:22px;font-weight:600;margin-bottom:6px;
}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:32px;}

label{
  display:block;
  font-size:11px;font-weight:600;
  letter-spacing:1.2px;color:var(--muted);
  text-transform:uppercase;
  margin-bottom:6px;margin-top:18px;
}
label:first-of-type{margin-top:0}

input,textarea,select{
  width:100%;padding:11px 14px;
  background:#061526;
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  transition:border-color .2s, box-shadow .2s;
  outline:none;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px #00e5ff14;
}
textarea{resize:none;height:80px;}

/* Ward selector */
.ward-group{display:flex;gap:10px;margin-top:0;}
.ward-opt{flex:1;position:relative;}
.ward-opt input[type=radio]{display:none;}
.ward-opt label{
  all:unset;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 10px;
  background:#061526;
  border:1px solid var(--border);
  border-radius:12px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  letter-spacing:.5px;
  color:var(--muted);
  transition:all .2s;
  text-transform:none;
  margin-top:0;
}
.ward-opt .icon{font-size:22px;}
.ward-opt input:checked + label{
  border-color:var(--cyan);
  color:var(--cyan);
  background:#001a2e;
  box-shadow:0 0 0 1px var(--cyan), 0 0 20px #00e5ff18;
}

button[type=submit]{
  margin-top:28px;
  width:100%;padding:14px;
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  color:#030d1a;
  border:none;border-radius:12px;
  font-family:'DM Sans',sans-serif;
  font-size:15px;font-weight:700;
  cursor:pointer;
  letter-spacing:.5px;
  transition:opacity .2s,transform .1s;
}
button[type=submit]:hover{opacity:.9}
button[type=submit]:active{transform:scale(.98)}

.back{
  display:block;text-align:center;margin-top:16px;
  font-size:13px;color:var(--muted);text-decoration:none;
}
.back:hover{color:var(--cyan)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🏥</div>
    <span class="logo-text">MED·MONITOR</span>
  </div>

  <h2>New Patient</h2>
  <p class="subtitle">Enter patient information to begin monitoring</p>

  <form action="/patient" method="POST">
    <label>Full Name</label>
    <input type="text" name="name" placeholder="e.g. Ahmed Hassan" required>

    <label>Age</label>
    <input type="number" name="age" placeholder="e.g. 45" min="0" max="120" required>

    <label>Admission Date</label>
    <input type="date" name="admission_date" required>

    <label>Initial Diagnosis</label>
    <textarea name="condition" placeholder="e.g. Respiratory failure, post-op monitoring…" required></textarea>

    <label>Ward</label>
    <div class="ward-group">
      <div class="ward-opt">
        <input type="radio" name="ward" id="ward-icu" value="icu" checked>
        <label for="ward-icu"><span class="icon">🏥</span>ICU</label>
      </div>
      <div class="ward-opt">
        <input type="radio" name="ward" id="ward-inc" value="incubator">
        <label for="ward-inc"><span class="icon">🍼</span>Incubator</label>
      </div>
    </div>

    <button type="submit">Add Patient →</button>
  </form>

  <a class="back" href="/">← Back to Monitor</a>
</div>
</body>
</html>
