<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedMonitor — Main Center</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#030d1a;--surface:#091525;--surface2:#0d1e35;
  --border:#0d3050;--border2:#1a4060;
  --cyan:#00e5ff;--cyan2:#00b4d8;
  --green:#00e676;--amber:#ffd600;--red:#ff4444;
  --text:#e0f4ff;--muted:#4a7a9b;--muted2:#2a5070;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;
  background-image:
    radial-gradient(ellipse 700px 500px at 5% 20%,#001a3318,transparent),
    radial-gradient(ellipse 500px 700px at 95% 80%,#003a5510,transparent);
}

/* ── Header ── */
.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 32px;
  border-bottom:1px solid var(--border);
  background:#030d1aee;
  backdrop-filter:blur(10px);
  position:sticky;top:0;z-index:50;
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{
  width:36px;height:36px;border-radius:9px;
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.logo-text{font-family:'Space Mono',monospace;font-size:12px;color:var(--cyan);letter-spacing:2px;}
.header-right{display:flex;gap:12px;align-items:center;}
.add-btn{
  padding:9px 20px;
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  color:#030d1a;border:none;border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;text-decoration:none;transition:opacity .2s;
}
.add-btn:hover{opacity:.85}

/* ── Ward Tabs ── */
.tabs{
  display:flex;gap:0;
  padding:20px 32px 0;
  border-bottom:1px solid var(--border);
}
.tab{
  display:flex;align-items:center;gap:8px;
  padding:12px 28px;
  background:transparent;border:none;
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;
  color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:all .2s;
  position:relative;
}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);}
.tab:hover:not(.active){color:var(--text);}
.tab-count{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:2px 9px;font-size:11px;
  font-family:'Space Mono',monospace;
}
.tab.active .tab-count{background:#001a2e;border-color:var(--cyan);color:var(--cyan);}
.unread-badge{
  position:absolute;top:6px;right:6px;
  min-width:18px;height:18px;padding:0 5px;
  background:var(--red);color:#fff;border-radius:10px;
  font-size:10px;font-weight:700;
  display:none;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace;
}
.unread-badge.show{display:flex;}

/* ── Pages ── */
.page{display:none;flex:1;padding:28px 32px;animation:fadeIn .3s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── Patient Grid ── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:20px;
}

/* ── Card ── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;padding:22px;cursor:pointer;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan-c, #00e5ff),transparent);
  opacity:.4;
}
.card:hover{transform:translateY(-3px);}
.card.normal {border-color:#1a4060;--cyan-c:#00e5ff;}
.card.normal:hover{border-color:var(--cyan);box-shadow:0 8px 40px #00e5ff14;}
.card.warning{border-color:#5a4200;--cyan-c:#ffd600;}
.card.warning:hover{border-color:var(--amber);box-shadow:0 8px 40px #ffd60014;}
.card.danger {border-color:#5a1a1a;--cyan-c:#ff4444;}
.card.danger:hover{border-color:var(--red);box-shadow:0 8px 40px #ff444414;}

.card-status-bar{height:3px;border-radius:2px;margin-bottom:16px;background:var(--border);}
.card.normal  .card-status-bar{background:var(--cyan);}
.card.warning .card-status-bar{background:var(--amber);}
.card.danger  .card-status-bar{background:var(--red);box-shadow:0 0 10px var(--red);}

.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.patient-name{font-size:16px;font-weight:600;margin-bottom:4px;}
.patient-info{font-size:12px;color:var(--muted);line-height:1.7;}

.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.5px;}
.badge-ward{background:#0d2a40;color:var(--cyan);border:1px solid #1a4060;}
.badge-status{display:inline-flex;align-items:center;}
.badge-status.normal {background:#002a0e;color:var(--green);border:1px solid #003d14;}
.badge-status.warning{background:#2a2000;color:var(--amber);border:1px solid #3d2f00;}
.badge-status.danger {background:#2a0505;color:var(--red)  ;border:1px solid #4a0a0a;}

.del-btn{
  width:26px;height:26px;min-width:26px;border-radius:7px;
  background:#2a0505;border:1px solid #4a1515;color:#ff6060;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .2s,transform .15s;flex-shrink:0;
}
.del-btn:hover{background:#3d0808;transform:scale(1.1);}
.del-btn:active{transform:scale(.95);}

.vitals{display:flex;gap:10px;margin-top:16px;}
.vital{
  flex:1;background:var(--surface2);border:1px solid var(--border);
  border-radius:12px;padding:10px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
}
.vital-label{font-size:10px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:.5px;}
.vital-val{font-size:18px;font-weight:700;font-family:'Space Mono',monospace;}
.vital-unit{font-size:9px;color:var(--muted);}
.v-pulse{color:var(--red);}
.v-spo2 {color:var(--cyan);}
.v-temp {color:var(--amber);}
.v-weight{color:var(--green);}

.secondaries{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.sec{
  display:flex;align-items:center;gap:5px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px;font-size:11px;color:var(--text);
}
.sec-icon{font-size:12px;}
.sec-val{font-family:'Space Mono',monospace;font-size:11px;color:var(--text);}

.ecg-off{
  display:flex;align-items:center;gap:5px;
  background:#2a0505;border:1px solid #4a1515;border-radius:8px;
  padding:5px 10px;font-size:11px;color:var(--red);
}

.empty{grid-column:1/-1;text-align:center;padding:80px 0;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.4;}
.empty-text{font-size:15px;}

/* ── Messaging Section ── */
.msg-section{
  margin-top:28px;
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:20px;
}
.msg-section h3{
  font-size:14px;color:var(--cyan);margin-bottom:14px;
  font-family:'Space Mono',monospace;letter-spacing:1px;
}
.msg-thread{
  max-height:260px;overflow-y:auto;
  display:flex;flex-direction:column;gap:8px;
  padding:4px;margin-bottom:14px;
}
.msg-bubble{
  max-width:75%;padding:10px 14px;border-radius:12px;
  font-size:13px;line-height:1.5;word-break:break-word;
}
.msg-bubble.sent{
  align-self:flex-end;
  background:#0a2a40;border:1px solid var(--cyan2);color:var(--text);
}
.msg-bubble.received{
  align-self:flex-start;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
}
.msg-meta{font-size:10px;color:var(--muted);margin-top:4px;}
.msg-sender{font-weight:600;color:var(--cyan);font-size:11px;}
.msg-compose{display:flex;gap:8px;}
.msg-input{
  flex:1;padding:10px 14px;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;
  outline:none;transition:border-color .2s;
}
.msg-input:focus{border-color:var(--cyan);}
.msg-send-btn{
  padding:10px 20px;
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  color:#030d1a;border:none;border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;transition:opacity .2s;
}
.msg-send-btn:hover{opacity:.85}
.msg-empty{text-align:center;padding:20px;color:var(--muted);font-size:13px;}

/* ── Bottom Nav ── */
.bottom-nav{
  display:flex;align-items:center;justify-content:center;gap:20px;
  padding:20px;border-top:1px solid var(--border);margin-top:auto;
}
.nav-arrow{
  width:38px;height:38px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);
  color:var(--cyan);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.nav-arrow:hover{background:var(--surface2);border-color:var(--cyan);}
.nav-label{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);}

/* ── Confirm Modal ── */
.overlay{
  display:none;position:fixed;inset:0;
  background:#000000cc;z-index:200;
  align-items:center;justify-content:center;
}
.overlay.show{display:flex;}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:32px;text-align:center;max-width:340px;width:90%;
}
.modal h3{font-size:16px;margin-bottom:8px;}
.modal p{font-size:13px;color:var(--muted);margin-bottom:24px;}
.modal-btns{display:flex;gap:12px;justify-content:center;}
.btn-cancel{
  padding:10px 24px;border-radius:10px;
  background:transparent;border:1px solid var(--border);
  color:var(--muted);cursor:pointer;font-size:13px;
  font-family:'DM Sans',sans-serif;transition:background .2s;
}
.btn-cancel:hover{background:var(--surface2);}
.btn-del{
  padding:10px 24px;border-radius:10px;
  background:var(--red);border:none;color:white;
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;
  cursor:pointer;transition:opacity .2s;
}
.btn-del:hover{opacity:.85}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">📡</div>
    <span class="logo-text">MED·MONITOR — MAIN CENTER</span>
  </div>
  <div class="header-right">
    <a class="add-btn" href="/form">+ Add Patient</a>
  </div>
</div>

<!-- Ward Tabs -->
<div class="tabs">
  <button class="tab active" id="tab-icu" onclick="switchTab('icu')">
    🏥 ICU
    <span class="tab-count" id="count-icu">0</span>
    <span class="unread-badge" id="unread-icu"></span>
  </button>
  <button class="tab" id="tab-incubator" onclick="switchTab('incubator')">
    🍼 Incubator
    <span class="tab-count" id="count-incubator">0</span>
    <span class="unread-badge" id="unread-incubator"></span>
  </button>
</div>

<!-- ICU Page -->
<div class="page active" id="page-icu">
  <div class="grid" id="grid-icu"></div>
  <div class="msg-section">
    <h3>💬 MESSAGES — ICU</h3>
    <div class="msg-thread" id="msg-thread-icu"></div>
    <div class="msg-compose">
      <input class="msg-input" id="msg-input-icu" placeholder="Type a message to ICU..." onkeydown="if(event.key==='Enter')sendMsg('icu')">
      <button class="msg-send-btn" onclick="sendMsg('icu')">Send</button>
    </div>
  </div>
</div>

<!-- Incubator Page -->
<div class="page" id="page-incubator">
  <div class="grid" id="grid-incubator"></div>
  <div class="msg-section">
    <h3>💬 MESSAGES — INCUBATOR</h3>
    <div class="msg-thread" id="msg-thread-incubator"></div>
    <div class="msg-compose">
      <input class="msg-input" id="msg-input-incubator" placeholder="Type a message to Incubator..." onkeydown="if(event.key==='Enter')sendMsg('incubator')">
      <button class="msg-send-btn" onclick="sendMsg('incubator')">Send</button>
    </div>
  </div>
</div>

<!-- Bottom Arrow Nav -->
<div class="bottom-nav">
  <button class="nav-arrow" onclick="prevTab()">←</button>
  <span class="nav-label" id="nav-label">ICU  &nbsp;·&nbsp;  1 / 2</span>
  <button class="nav-arrow" onclick="nextTab()">→</button>
</div>

<!-- Delete Confirm Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Remove Patient</h3>
    <p id="modal-msg">Are you sure?</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-del" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
const WARDS = ['icu','incubator'];
let currentWard = 'icu';
let pendingDeleteId = null;

// ── Tab switching ──
function switchTab(ward){
  currentWard = ward;
  WARDS.forEach(w=>{
    document.getElementById('tab-'+w).classList.toggle('active', w===ward);
    document.getElementById('page-'+w).classList.toggle('active', w===ward);
  });
  document.getElementById('nav-label').textContent =
    (ward==='icu' ? 'ICU':'Incubator') + '  ·  ' +
    (WARDS.indexOf(ward)+1) + ' / ' + WARDS.length;

  // Mark messages as read when switching to a tab
  fetch('/mark_read/main_from_'+ward, {method:'POST'});
}
function prevTab(){
  const i = WARDS.indexOf(currentWard);
  switchTab(WARDS[(i-1+WARDS.length)%WARDS.length]);
}
function nextTab(){
  const i = WARDS.indexOf(currentWard);
  switchTab(WARDS[(i+1)%WARDS.length]);
}

// ── Status helpers ──
function getStatus(s, ward){
  const ecgOff = s.ecg_lead_off;
  const isNeo  = ward==='incubator';
  const pulseHi = isNeo ? 180 : 110;
  const pulseWn = isNeo ? 165 : 100;

  if(s.spo2===0)
    return {cls:'warning',dot:'🟡',label:'Sensor Error'};
  if(ecgOff || s.pulse>pulseHi || s.spo2<88 || s.temp_body>39.5 || s.air_quality>80)
    return {cls:'danger' ,dot:'🔴',label:'Critical'};
  if(s.pulse>pulseWn || s.spo2<93 || s.temp_body>37.8 || s.air_quality>55)
    return {cls:'warning',dot:'🟡',label:'Warning'};
  return   {cls:'normal' ,dot:'🟢',label:'Stable'};
}

// ── Card builder ──
function buildCard(id, p, ward){
  const s  = p.sensor;
  const st = getStatus(s, ward);
  const wardLabel = ward==='icu' ? '🏥 ICU' : '🍼 Incubator';

  const ecgTag = s.ecg_lead_off
    ? `<span class="ecg-off">⚡ Lead OFF</span>`
    : `<span class="sec"><span class="sec-icon">⚡</span><span class="sec-val">${s.ecg}</span></span>`;

  const div = document.createElement('div');
  div.className = 'card ' + st.cls;
  div.onclick = () => window.location.href='/dashboard/'+id;
  div.innerHTML = `
    <div class="card-status-bar"></div>
    <div class="card-head">
      <div>
        <div class="patient-name">${p.info.name}</div>
        <div class="patient-info">
          Age ${p.info.age} &nbsp;·&nbsp; ${p.info.admission_date}<br>
          ${p.info.condition}
        </div>
      </div>
      <button class="del-btn" title="Remove"
        onclick="askDelete(event,${id},'${p.info.name.replace(/'/g,"\\\'")}')">✕</button>
    </div>

    <div class="badges" style="margin-top:10px">
      <span class="badge badge-ward">${wardLabel}</span>
      <span class="badge badge-status ${st.cls}">${st.dot} ${st.label}</span>
    </div>

    <div class="vitals">
      <div class="vital">
        <span class="vital-label">PULSE</span>
        <span class="vital-val v-pulse">${s.pulse}</span>
        <span class="vital-unit">BPM</span>
      </div>
      <div class="vital">
        <span class="vital-label">SpO₂</span>
        <span class="vital-val v-spo2">${s.spo2}</span>
        <span class="vital-unit">%</span>
      </div>
      <div class="vital">
        <span class="vital-label">BODY T</span>
        <span class="vital-val v-temp">${Number(s.temp_body).toFixed(1)}</span>
        <span class="vital-unit">°C</span>
      </div>
      ${ward==='incubator' ? `<div class="vital">
        <span class="vital-label">WEIGHT</span>
        <span class="vital-val v-weight">${Number(s.weight).toFixed(2)}</span>
        <span class="vital-unit">kg</span>
      </div>` : ''}
    </div>

    <div class="secondaries">
      ${ecgTag}
      <span class="sec"><span class="sec-icon">💨</span><span class="sec-val">${s.air_quality}%</span></span>
      <span class="sec"><span class="sec-icon">🔊</span><span class="sec-val">${s.sound}%</span></span>
      <span class="sec"><span class="sec-icon">🌡️</span><span class="sec-val">${Number(s.temp_dht).toFixed(1)}°C</span></span>
      <span class="sec"><span class="sec-icon">💧</span><span class="sec-val">${Number(s.humidity).toFixed(0)}%</span></span>
    </div>`;

  return div;
}

// ── Load & render patients ──
async function loadPatients(){
  try{
    const res  = await fetch('/all_data');
    const data = await res.json();

    const grids = {icu: document.getElementById('grid-icu'),
                   incubator: document.getElementById('grid-incubator')};
    const counts = {icu:0, incubator:0};

    const scroll = {};
    WARDS.forEach(w=>{ scroll[w]=grids[w].scrollTop; });

    grids.icu.innerHTML = '';
    grids.incubator.innerHTML = '';

    for(const id of Object.keys(data)){
      const p = data[id];
      const ward = p.info.ward || 'icu';
      if(!grids[ward]) continue;
      grids[ward].appendChild(buildCard(id, p, ward));
      counts[ward]++;
    }

    WARDS.forEach(w=>{
      document.getElementById('count-'+w).textContent = counts[w];
      if(!counts[w]){
        grids[w].innerHTML = `
          <div class="empty">
            <div class="empty-icon">${w==='icu'?'🏥':'🍼'}</div>
            <div class="empty-text">No ${w==='icu'?'ICU':'Incubator'} patients yet</div>
          </div>`;
      }
      grids[w].scrollTop = scroll[w];
    });
  }catch(e){console.error(e);}
}

// ── Delete flow ──
function askDelete(e, id, name){
  e.stopPropagation();
  pendingDeleteId = id;
  document.getElementById('modal-msg').textContent =
    `Remove "${name}" from monitoring?`;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){
  pendingDeleteId=null;
  document.getElementById('overlay').classList.remove('show');
}
async function confirmDelete(){
  if(pendingDeleteId===null) return;
  await fetch('/delete_patient/'+pendingDeleteId,{method:'DELETE'});
  closeModal();
  loadPatients();
}
document.getElementById('overlay').addEventListener('click',function(e){
  if(e.target===this) closeModal();
});

// ── Messaging ──
async function sendMsg(ward){
  const input = document.getElementById('msg-input-'+ward);
  const text = input.value.trim();
  if(!text) return;
  input.value = '';

  await fetch('/send_message', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sender:'main', receiver:ward, message:text})
  });
  loadMessages(ward);
}

async function loadMessages(ward){
  try{
    const res = await fetch('/get_messages/'+ward);
    const msgs = await res.json();
    const thread = document.getElementById('msg-thread-'+ward);
    if(!msgs.length){
      thread.innerHTML = '<div class="msg-empty">No messages yet</div>';
      return;
    }
    thread.innerHTML = msgs.map(m => {
      const isSent = m.sender === 'main';
      const senderLabel = isSent ? 'Main Center' : (m.sender==='icu'?'ICU':'Incubator');
      const time = m.timestamp ? m.timestamp.split(' ')[1] || m.timestamp : '';
      return `<div class="msg-bubble ${isSent?'sent':'received'}">
        <div class="msg-sender">${senderLabel}</div>
        ${m.message}
        <div class="msg-meta">${time}</div>
      </div>`;
    }).join('');
    thread.scrollTop = thread.scrollHeight;
  }catch(e){console.error(e);}
}

async function loadUnreadCounts(){
  try{
    for(const w of WARDS){
      const res = await fetch('/unread_count/main_from_'+w);
      // Actually we track unread by receiver='main', so let's just show
      // total unread from each ward
    }
  }catch(e){}
}

// ── Polling ──
setInterval(loadPatients, 2000);
setInterval(()=>{ WARDS.forEach(loadMessages); }, 3000);
loadPatients();
WARDS.forEach(loadMessages);
</script>
</body>
</html>
